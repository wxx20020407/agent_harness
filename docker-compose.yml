      - TEAM_ID=team-b
      - TEAM_NAME=Team B Agent
      - TEAM_DIR=/teams/team-b
      - OPENCODE_URL=http://opencode-team-b:4096
      - OPENCODE_PASSWORD=${TEAM_B_PASSWORD:-team-b-secret}
      - PORT=3000
    volumes:
      - ./teams/team-b:/teams/team-b
      - ./data:/data/agent_harness/data
      - ./.env:/data/agent_harness/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "120"
    ports:
      - "4202:3000"
    depends_on:
      opencode-team-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ui-team-b:
    <<: *ui-common
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
      args:
        - TEAM_ID=team-a
    environment:
      - API_UPSTREAM_URL=http://api-team-b:3000
    ports:
      - "4312:80"
    depends_on:
      - api-team-b

  # ===========================================================================
  # Team C - 飞书集成 & 项目管理助手
  # ===========================================================================

  opencode-team-c:
    build:
      context: .
      dockerfile: deploy/Dockerfile.opencode
