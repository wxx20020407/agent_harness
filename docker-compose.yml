      - OPENCODE_CONFIG=/workspace/opencode.json
      - OPENCODE_CONFIG_DIR=/workspace
      - 'OPENCODE_CONFIG_CONTENT={"model":"internal-llm/zhipuai/glm-5","provider":{"internal-llm":{"npm":"@ai-sdk/openai-compatible","name":"Internal LLM","env":["LLM_API_KEY"],"options":{"baseURL":"${LLM_BASE_URL}"},"models":{"zhipuai/glm-5":{"name":"glm-5"}}}},"enabled_providers":["internal-llm"],"server":{"hostname":"0.0.0.0","port":4096},"instructions":["./AGENTS.md"],"permission":{"skill":{"*":"allow"},"read":"allow","list":"allow","edit":"allow","write":"allow","bash":"allow"}}'
    ports:
      - "4103:4096"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --server-response -O/dev/null http://127.0.0.1:4096/ 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|401)'"]
